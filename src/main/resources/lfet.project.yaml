LFET:

  ide.default: Java

  ide.Java:
    enabled: true
    BaseOfVersion: DT
    Package: io.rulebased.group.javahelp.converter.antora
    src.path: ${project.root}/../java/${Package}
    ini.path: '""'

    Interface:
      enabled: true
      Name: ${dtName}IFace
      Generic: true
      RuleGroups: true
      IgnoreQmark: true
      # RuleID: trace
      Modifier: '""'
      MethodModifier: '""'
      # TraceAfterRule: true
      Annotations: javax.annotation.Generated("LF-ET"), SuppressWarnings("UnnecessaryFullyQualifiedName")
      Language: English

    InterfaceRulesClass:
      Name: ${dtName}RulesEngine
      Modifier: '""'
      MethodModifier: public
      Annotations: javax.annotation.Generated("LF-ET"), SuppressWarnings("ConstantConditions")

    InterfaceEnum:
      001:
        Symbol: true
        Title: true
        MethodName: EnumName
        IncludeTags:
          Text:
          - $$Enum.Plain
      002:
        Symbol: true
        Title: true
        MethodName: EnumName
        EnumValueName:
          - Symbol
          - UpperCase
          - Prefix$
        IncludeTags:
          Text:
            - $$Enum.Symbol
